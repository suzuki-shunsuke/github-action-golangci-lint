---
name: Test
on: workflow_call
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.63.0
          working_directory: tests/v2

      - uses: ./
        with:
          working_directory: tests/v1

      - uses: ./
        with:
          working_directory: tests/v1
          timeout: 30s

      - uses: ./
        with:
          working_directory: tests/v2

      - uses: ./
        with:
          working_directory: tests/v2
          timeout: 30s
