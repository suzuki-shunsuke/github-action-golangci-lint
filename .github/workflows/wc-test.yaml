---
name: Test
on: workflow_call
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3.7.0
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
          working_directory: tests/v2

      - uses: ./
        with:
          working_directory: tests/v1

      - uses: ./
        with:
          working_directory: tests/v1
          timeout: 30s

      - uses: ./
        with:
          working_directory: tests/v2

      - uses: ./
        with:
          working_directory: tests/v2
          timeout: 30s
