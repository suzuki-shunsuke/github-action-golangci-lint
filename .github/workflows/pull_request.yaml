name: pull request

on: pull_request

jobs:
  status-check:
    # This job is used for main branch's branch protection rule's status check.
    # If all dependent jobs succeed or are skipped this job succeeds.
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs:
      - test
      - test-workflow
    permissions: {}
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - run: exit 1

  test:
    uses: ./.github/workflows/wc-test.yaml
    permissions:
      contents: read
      pull-requests: write

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
